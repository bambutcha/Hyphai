services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyphai
      POSTGRES_PASSWORD: hyphai
      POSTGRES_DB: hyphai
    ports:
      - "5433:5432"
    volumes:
      - hyphai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyphai -d hyphai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hyphai_pgdata:
